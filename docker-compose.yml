services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parcelpath
      POSTGRES_USER: parcelpath
      POSTGRES_PASSWORD: parcelpath
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcelpath -d parcelpath"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/parcelpath
      DB_USER: parcelpath
      DB_PASSWORD: parcelpath
    ports:
      - "8080:8080"

volumes:
  pgdata:
